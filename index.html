<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vivero Chaka | Login</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="logo.png">
</head>
<body>
<div class="login-container">
  <div class="login-header">
    <div class="logo">
      <img src="logo.png" alt="Vivero Chaka" style="height: 60px; margin-right: 15px;">
      <div>
        <h1>Vivero <span>Chaka</span></h1>
        <p class="subtitle">Sistema de Gestión Integral</p>
      </div>
    </div>
  </div>

  <div class="login-card">
    <div class="card-header">
      <h2>Iniciar Sesión</h2>
      <p>Ingresa tus credenciales para acceder al sistema</p>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">
          <i class="fas fa-envelope"></i> Correo Electrónico
        </label>
        <input type="email" id="email" placeholder="usuario@correo.com" required>
      </div>

      <div class="form-group">
        <label for="password">
          <i class="fas fa-lock"></i> Contraseña
        </label>
        <div style="position: relative;">
          <input type="password" id="password" placeholder="********" required>
          <div class="password-toggle">
            <i class="fas fa-eye" id="togglePassword"></i>
          </div>
        </div>
      </div>

      <button type="submit" class="btn-login">
        <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
      </button>
    </form>

    <div class="login-footer">
      <p>© 2026 Vivero Chaka. Todos los derechos reservados.</p>
      <p class="version">v2.0.0</p>
    </div>
  </div>
</div>

<script src="js/auth.js"></script>
</body>
</html>
